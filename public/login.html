<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login - OmniAntigravity Remote Chat</title>
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/app-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #1e1e1e;
        --surface: #181818;
        --primary: #6b4cff;
        --text: #cccccc;
        --text-muted: #777777;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 30% 20%,
            rgba(107, 76, 255, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 70% 80%,
            rgba(168, 85, 247, 0.05) 0%,
            transparent 50%
          );
        animation: gradientShift 8s ease-in-out infinite alternate;
        z-index: 0;
      }

      @keyframes gradientShift {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        100% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      .login-card {
        background: var(--surface);
        padding: 2.5rem;
        border-radius: 1.5rem;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.8),
          0 0 40px rgba(107, 76, 255, 0.06);
        width: 90%;
        max-width: 400px;
        text-align: center;
        border: 1px solid #333333;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        z-index: 1;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
        background: linear-gradient(
          135deg,
          #6366f1 0%,
          #a855f7 50%,
          #ec4899 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
      }

      p {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 2.5rem;
      }

      .input-group {
        position: relative;
        margin-bottom: 1.25rem;
      }

      input {
        width: 100%;
        padding: 1.1rem 3.25rem 1.1rem 1.1rem;
        background: #2a2a2a;
        border: 1px solid #333333;
        border-radius: 0.85rem;
        color: #fff;
        box-sizing: border-box;
        outline: none;
        transition: all 0.3s;
        font-size: 1rem;
        -webkit-appearance: none;
      }

      /* Dark autofill override for Android / Chrome */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: #ffffff !important;
        -webkit-box-shadow: 0 0 0px 1000px #2a2a2a inset !important;
        box-shadow: 0 0 0px 1000px #2a2a2a inset !important;
        transition: background-color 5000s ease-in-out 0s;
      }

      /* Suppress native reveal/clear buttons */
      input::-ms-reveal,
      input::-ms-clear {
        display: none;
      }

      /* Suppress native credentials autofill icon from overlapping button */
      input::-webkit-credentials-auto-fill-button {
        visibility: hidden;
        pointer-events: none;
        position: absolute;
        right: 0;
      }

      .toggle-password {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        -webkit-tap-highlight-color: transparent;
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        width: 2.5rem;
        height: 2.5rem;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 0.5rem;
        box-shadow: none;
        color: rgba(255, 255, 255, 0.75);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s, background 0.2s, transform 0.15s;
        z-index: 10;
      }

      .toggle-password:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
      }

      .toggle-password:active {
        transform: translateY(-50%) scale(0.92);
        background: rgba(255, 255, 255, 0.15);
      }

      .toggle-password:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--primary);
        color: #ffffff;
      }

      .toggle-password svg {
        width: 22px;
        height: 22px;
        min-width: 22px;
        min-height: 22px;
        flex-shrink: 0;
        display: block;
        stroke: currentColor;
      }

      .toggle-password .eye-off-icon {
        display: none !important;
      }

      .toggle-password[aria-pressed="true"] .eye-icon {
        display: none !important;
      }

      .toggle-password[aria-pressed="true"] .eye-off-icon {
        display: block !important;
      }

      input:focus {
        border-color: var(--primary);
        background: #303030;
        box-shadow: 0 0 0 4px rgba(107, 76, 255, 0.12);
      }

      #loginBtn {
        width: 100%;
        padding: 1.1rem;
        background: linear-gradient(135deg, #6b4cff, #5839e8);
        color: #fff;
        border: none;
        border-radius: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 1rem;
        box-shadow: 0 4px 16px rgba(107, 76, 255, 0.3);
      }

      #loginBtn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(107, 76, 255, 0.4);
      }

      #loginBtn:active:not(:disabled) {
        transform: translateY(0);
      }

      #loginBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .error {
        color: #ef4444;
        font-size: 0.9rem;
        margin-top: 1.25rem;
        display: none;
        padding: 0.75rem;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <h1>OmniAntigravity</h1>
      <p>Remote chat access — enter passcode</p>
      <div class="input-group">
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          autofocus
        />
        <button
          type="button"
          id="togglePasswordBtn"
          class="toggle-password"
          aria-label="Show password"
          title="Show password"
          aria-pressed="false"
        >
          <svg
            class="eye-icon"
            width="22"
            height="22"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg
            class="eye-off-icon"
            width="22"
            height="22"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path
              d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
            />
            <path
              d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
            />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        </button>
      </div>
      <button id="loginBtn">Connect Securely</button>
      <div class="error" id="error">Invalid password. Please try again.</div>
    </div>
    <script src="/js/login.js?v=1.3.1"></script>
  </body>
</html>
